<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <title>Terméknév kereső</title>
  <link rel="icon" href="logoikon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f5f7fb;
      --bg-accent: #eef2ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-weak: #e8efff;
      --border: #e6eaf0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-lg: 0 10px 30px rgba(15, 23, 42, .08);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, .06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: var(--text);
      background:
        radial-gradient(1000px 800px at 10% -10%, var(--bg-accent) 0, transparent 60%),
        radial-gradient(900px 700px at 120% 0%, #fef3c7 0, transparent 50%),
        var(--bg);
    }

    .app {
      max-width: 1024px;
      margin: 32px auto;
      padding: 0 18px;
      display: grid;
      gap: 18px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(180deg, #fff, #fbfdff);
    }

    .brand img {
      width: 40px;
      height: 40px
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .2px
    }

    .brand .sub {
      color: var(--muted);
      font-size: 13px
    }

    .content {
      padding: 18px
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .grid-2 {
      grid-template-columns: 1fr 1fr
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr
      }
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input[type="text"]::placeholder {
      color: #94a3b8
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #c7d2fe;
      box-shadow: 0 0 0 4px #e0e7ff
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px
    }

    button {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .02s, filter .15s;
      box-shadow: var(--shadow-md);
    }

    button:hover {
      filter: brightness(1.05)
    }

    button:active {
      transform: translateY(1px)
    }

    button[disabled] {
      opacity: .55;
      filter: none;
      cursor: not-allowed;
      box-shadow: none
    }

    .muted {
      color: var(--muted);
      font-size: 13px
    }

    #ean-status {
      min-height: 22px;
      font-size: 13px;
      margin-top: 6px
    }

    #ean-status.ok {
      color: var(--success)
    }

    #ean-status.warn {
      color: var(--warning)
    }

    #ean-status.err {
      color: var(--danger)
    }

    #scanner {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .scan-roi {
      position: absolute;
      inset: 24% 24% 24% 24%;
      border: 2px dashed rgba(255, 255, 255, .65);
      border-radius: 12px;
      pointer-events: none;
    }

    .cam-controls {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px
    }

    .cam-controls.active {
      display: flex
    }

    input[type="range"] {
      accent-color: var(--primary);
      height: 4px;
      background: linear-gradient(90deg, var(--primary-weak), #fff);
      border-radius: 999px;
      width: 180px;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden
    }

    .table-scroll {
      max-height: 420px;
      overflow: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf0f3;
      white-space: nowrap;
      text-align: left
    }

    tbody tr:nth-child(2n) {
      background: #fbfdff
    }
  </style>
</head>

<body>
  <div class="app">

    <section class="card brand">
      <img src="logoikon.png" alt="MELEGET.hu logo">
      <div>
        <h1>Terméknév kereső</h1>
        <div class="sub">Gyors keresés cikkszám / terméknév vagy EAN alapján</div>
      </div>
    </section>

    <section class="card">
      <div class="content">
        <div class="grid grid-2">
          <div>
            <label for="cikkszam">Cikkszám</label>
            <input type="text" id="cikkszam" placeholder="Pl. AZI-WN35VA" />
          </div>
          <div>
            <label for="termeknev">Terméknév</label>
            <input type="text" id="termeknev" placeholder="Pl. AZURI MIDORI" />
          </div>
        </div>

        <div style="margin-top:12px">
          <label for="ean">EAN</label>
          <input type="text" id="ean" inputmode="numeric" placeholder="Pl. 5906675300221" />
          <div id="ean-status" class="muted"></div>
        </div>

        <div class="btn-row">
          <button type="button" id="scan-btn">Vonalkód olvasása</button>
          <button type="button" id="open-link-btn" disabled>Link megnyitása</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="content">
        <div id="scanner"></div>

        <div class="cam-controls" id="cam-controls">
          <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1" disabled title="Zoom">
          <button type="button" id="zoom-out" disabled title="Zoom –">–</button>
          <button type="button" id="zoom-in" disabled title="Zoom +">+</button>

          <button type="button" id="torch-btn" disabled title="Zseblámpa">Fény</button>

          <span class="muted">Fényerő</span>
          <input type="range" id="exposure-slider" min="0.6" max="1.6" step="0.05" value="1.0" disabled title="Fényerő">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="content">
        <div class="table-wrap">
          <div class="table-scroll">
            <table id="tabla">
              <thead>
                <tr>
                  <th>Cikkszám</th>
                  <th>Terméknév</th>
                </tr>
              </thead>
              <tbody id="tabla-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script src="adatbazis.js"></script>
  <script src="script.js"></script>
</body>

</html>
