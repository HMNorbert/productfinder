<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <title>Terméknév kereső</title>
  <link rel="icon" href="logoikon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-weak: #e6efff;
      --primary-weak-2: #eef4ff;
      --border: #e5e7eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 1200px at 10% -10%, #eef2ff 0, #fff 50%) fixed, var(--bg);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      letter-spacing: .2px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      margin-top: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: .25px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input::placeholder {
      color: #9aa3af
    }

    input:focus {
      outline: none;
      border-color: #c7d2fe;
      box-shadow: 0 0 0 3px #e0e7ff;
      background: #fff;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 4px;
      flex-wrap: wrap;
    }

    button {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: filter .15s ease, transform .02s ease;
      font-size: 14px;
    }

    button:hover {
      filter: brightness(1.05)
    }

    button:active {
      transform: translateY(1px)
    }

    button[disabled] {
      opacity: .55;
      filter: none;
      cursor: not-allowed
    }

    #ean-status {
      min-height: 22px;
      font-size: 13px;
      margin: 4px 2px 8px;
    }

    #ean-status.ok {
      color: var(--success)
    }

    #ean-status.warn {
      color: var(--warning)
    }

    #ean-status.err {
      color: var(--danger)
    }

    #scanner {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    .scan-roi {
      position: absolute;
      inset: 25% 25% 25% 25%;
      border: 2px dashed rgba(255, 255, 255, .65);
      border-radius: 12px;
      pointer-events: none;
    }

    .table-wrap {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .table-scroll {
      overflow: auto;
      max-height: 420px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9fafb;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf0f3;
      text-align: left;
      white-space: nowrap;
    }

    tbody tr:nth-child(2n) {
      background: #fbfdff
    }

    @media (max-width: 640px) {
      .filters {
        grid-template-columns: 1fr
      }

      .table-scroll {
        max-height: 60vh
      }

      .container {
        padding: 16px 12px 30px
      }

      .card {
        border-radius: 14px;
        padding: 16px
      }

      #scanner {
        border-radius: 14px
      }

      .btn-row {
        gap: 6px
      }

      input[type="text"] {
        font-size: 16px
      }

      .table-wrap {
        border-radius: 10px
      }

      .table-scroll {
        border-radius: 10px
      }

      .table-wrap,
      .table-scroll {
        width: 100%
      }

      table {
        font-size: 12px
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="filters">
      <div>
        <label for="cikkszam">Cikkszám</label>
        <input type="text" id="cikkszam" placeholder="Pl. AZI-WN35VA" />
      </div>

      <div>
        <label for="termeknev">Terméknév</label>
        <input type="text" id="termeknev" placeholder="Pl. AZURI MIDORI" />
      </div>
    </div>

    <div>
      <label for="ean">EAN</label>
      <input type="text" id="ean" inputmode="numeric" placeholder="Pl. 5906675300221" />
    </div>

    <div class="btn-row">
      <button type="button" id="scan-btn">Vonalkód olvasása</button>
      <button type="button" id="open-link-btn" disabled>Link megnyitása</button>

      <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1" disabled style="width:160px">
      <button type="button" id="zoom-out" disabled>–</button>
      <button type="button" id="zoom-in" disabled>+</button>
      <button type="button" id="refocus-btn" disabled>Fókusz</button>
      <button type="button" id="torch-btn" disabled>Fény</button>
    </div>

    <div id="ean-status"></div>
    <div id="scanner"></div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table id="tabla">
          <thead>
            <tr>
              <th>Cikkszám</th>
              <th>Terméknév</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

  <script src="adatbazis.js"></script>
  <script src="script.js"></script>
</body>

</html>
